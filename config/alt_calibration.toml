# Online Appendix A: the simulation calibrated to the regime model with diagonal
# within-regime factor covariances, the highest likelihood reached from the same
# 1,000 starts. The factors are then uncorrelated within each regime. The
# estimators are those of the main study; the framework_diag strategy restricts
# its own regime model in the same way.

extends = "main.toml"
name = "alt_calibration"

[regimes]
covariance = "diag"

[exhibits]
regime_labels = ["Value", "Growth", "Turbulence"]
